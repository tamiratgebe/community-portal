services:
  - type: web
    name: community-portal
    runtime: node
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/public/stats
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: community-portal-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production

databases:
  - name: community-portal-db
    databaseName: community_portal
    user: community_portal
