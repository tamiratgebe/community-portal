<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Community Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <h1>Create Account</h1>

            <p>
                Join the community portal
            </p>

            <form id="registerForm">

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="text"
                        id="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="At least 6 characters"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Enter password again"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary submit-btn">

                    Create Account

                </button>


                <p
                    id="registerMessage"
                    class="form-message">
                </p>

            </form>


            <p class="auth-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <script>

        const registerForm =
            document.getElementById(
                "registerForm"
            );

        const message =
            document.getElementById(
                "registerMessage"
            );


        registerForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const fullName =
                    document.getElementById(
                        "fullName"
                    ).value.trim();

                const phone =
                    document.getElementById(
                        "phone"
                    ).value.trim();

                const password =
                    document.getElementById(
                        "password"
                    ).value;

                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;


                if (password !== confirmPassword) {

                    message.textContent =
                        "Passwords do not match.";

                    message.className =
                        "form-message error";

                    return;
                }


                try {

                    const response =
                        await fetch(
                            "/api/auth/register",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        fullName:
                                            fullName,

                                        phone:
                                            phone,

                                        password:
                                            password
                                    })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.error ||
                            "Registration failed"
                        );

                    }


                    message.textContent =
                        "Account created successfully! Redirecting to login...";

                    message.className =
                        "form-message success";


                    setTimeout(
                        function () {

                            window.location.href =
                                "login.html";

                        },
                        1500
                    );


                } catch (error) {

                    message.textContent =
                        error.message;

                    message.className =
                        "form-message error";

                }

            }
        );

    </script>

</body>

</html>
